# yaml-language-server: $schema=https://raw.githubusercontent.com/Alknoma/minutehand/integration-main/schemas/agent.schema.json
# The studio's site agent under Minutehand. Every way the agent is reached, and every way it reaches out:
#   in   site touches (/api/events)        scripted navigation: `uses` below
#   in   what they write (/api/thread/*)   `uses` (writes, asks) and `decisions` (reply, open, dismiss)
#   in   reactions to what it shows        `pending` + `decisions`: a model playing the visitor picks and words them
#   in   email replies (/inbound/email)    the mail host's `replies`: the visitor's answers, written by a model
#   in   unsubscribe link                  `uses: unsubscribes`
#   in   its own wakes (/wake, /report)    `wakes`
#   out  messages in the chat             `/api/shown`, read as the visitor's inbox
#   out  emails                            mail.fieldwork.example: captured, never sent
#   out  hand-over to the studio's CRM     crm.fieldwork.example: captured, never sent
#   out  research                          the model API (recorded); pages it reads: passed through and kept
#                                          (--capture-unknown reads); Apollo: passed through when a key is set
# From prospect-agent/, with OPENAI_API_KEY, MINUTEHAND_MODEL and MINUTEHAND_MODEL_API_KEY set, every visitor of
# visits/ in parallel, each under N seeds (`--samples`), each run on a port and database of its own:
#   minutehand run-all simulation/visits --agent simulation/agent.yaml --samples 3 --capture-unknown reads -- \
#     env PORT={run.port} AGENT_DB={run.dir}/agent.db MAIL_URL=https://mail.fieldwork.example/send \
#     CRM_URL=https://crm.fieldwork.example/leads uv run python -m agent.server
version: 1
name: studio_site_agent

wakes:
  - kind: reported
    wake_url: http://127.0.0.1:{run.port}/wake
    report_url: http://127.0.0.1:{run.port}/report
    wake_timeout: PT10M

outbound:
  - host: mail.fieldwork.example
    name: mail
    kind: acknowledge
    answer: {status: 200, json_body: {ok: true}}
    message:
      recipients: [to]
      text: [text]
      subject: [subject]
    replies:
      url: http://127.0.0.1:{run.port}/inbound/email
  - host: crm.fieldwork.example
    name: crm
    kind: acknowledge
    answer: {status: 201, json_body: {ok: true}}
  - host: api.apollo.io
    name: apollo
    kind: pass_through
  - host: api.perplexity.ai
    name: perplexity
    kind: pass_through
  - host: api.scraperapi.com
    name: scraperapi
    kind: pass_through
  # The visitors' own businesses: each site as its owner runs it, served inside the run (simulation/sites/).
