    text: "<!doctype html><html><head><title>Bruno\u2019s Bowl \u2014 Fresh dog meals, delivered</title><meta name=\"viewport\"\
      \ content=\"width=device-width,initial-scale=1\"></head><body><header><a href=\"/\">Bruno\u2019s Bowl</a><nav><a href=\"\
      /meals\">Meals</a><a href=\"/how-it-works\">How it Works</a><a href=\"/pricing\">Pricing</a><a href=\"/reviews\">Reviews</a><a\
      \ href=\"/blog\">Blog</a><a href=\"/account/login\">Log in</a></nav></header><main><section class=\"hero\"><h1>Fresh,\
      \ gently cooked meals for your dog</h1><p>From \xA31.89/day. Get your first box for \xA312 today.</p><button onclick=\"\
      location.href='/meals/trial'\">Start for \xA312</button><div class=\"trust\">4.8\u2605 Trustpilot \u2022 12,000+ dogs\
      \ fed</div></section><section class=\"quiz\"><h2>Build your plan</h2><form action=\"/meals/plan\" method=\"get\"><label>Dog\
      \ name<input name=\"dog_name\" type=\"text\" required></label><label>Age<select name=\"age\"><option>Puppy</option><option>Adult</option><option>Senior</option></select></label><label>Weight\
      \ (kg)<input name=\"weight\" type=\"number\" min=\"1\" step=\"0.5\" required></label><label>Breed (optional)<input name=\"\
      breed\" type=\"text\"></label><label>Email<input name=\"email\" type=\"email\" required></label><label>Postcode<input\
      \ name=\"postcode\" type=\"text\" required></label><small>Takes ~60 seconds. We\u2019ll show portions and your price.</small><button\
      \ type=\"submit\">Build my plan</button></form></section><section class=\"how\"><h2>How it works</h2><ol><li>Tell us\
      \ about your dog</li><li>We cook and deliver on ice</li><li>Pause or cancel anytime</li></ol></section><section class=\"\
      pricing\"><h2>Pricing</h2><p>Most plans land between \xA349\u2013\xA389/month after your trial, depending on weight\
      \ and activity.</p></section><section class=\"reviews\"><h2>Real owners, real results</h2><p>\u201CHe actually licks\
      \ the bowl clean.\u201D \u2014 Amy, Leeds</p></section></main><footer><p>DPD Next Day delivery Tue\u2013Thu. Please\
      \ freeze on arrival.</p><p>Your \xA312 trial renews automatically to your plan to avoid gaps in feeding. Manage in your\
      \ account. We prep weekly; pause/cancel 48h before your renewal.</p><p>Support: hello@brunosbowl.example \u2022 020\
      \ 0000 0000 (10am\u20133pm)</p><small>Account is created after checkout; password email may take up to 10 minutes.</small></footer></body></html>"
