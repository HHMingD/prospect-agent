      headers:
        content-type: text/html; charset=utf-8
      text: "<!doctype html><html><head><title>Trial Box \xA312 | Bruno\u2019s Bowl</title><meta name=\"viewport\" content=\"\
        width=device-width,initial-scale=1\"></head><body><header><a href=\"/\">Bruno\u2019s Bowl</a><nav><a href=\"/meals\"\
