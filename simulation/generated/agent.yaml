        \ type=\"password\" name=\"pw\" required></label><label>Confirm password<input type=\"password\" name=\"pw2\" required></label><label><input\
        \ type=\"checkbox\" name=\"terms\" required>I accept the Terms & Privacy</label><label><input type=\"checkbox\" name=\"\
        marketing\">Email me studio news</label><label><input type=\"checkbox\" name=\"sms_optin\">SMS reminders</label><button\
