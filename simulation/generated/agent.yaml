        \ Yoga 60</h3><p>Shoreditch \u2022 Today 18:30 \u2022 60 mins \u2022 6 spots left</p><button class=\"book\" data-class=\"\
        1234\">Book</button></article><article><h3>Vinyasa Open</h3><p>Hackney \u2022 Today 19:15 \u2022 60 mins \u2022 3\
        \ spots left</p><button class=\"book\" data-class=\"1235\">Book</button></article></div><section class=\"prices\"\
        ><h2>Prices</h2><ul><li>Single class \xA318</li><li>10-class pack \xA3140</li><li>Intro Offer 30 days \xA339 (new\
        \ clients only)</li></ul><small>Prices shown and applied at checkout. Some classes excluded from Intro Offer.</small></section><section\
