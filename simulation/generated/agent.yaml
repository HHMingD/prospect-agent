        badge\">New customer offer \u2022 Ends tonight</div><ul><li>Vet-approved recipes</li><li>Personalised portions</li><li>No\
        \ nasties</li></ul><form action=\"/checkout\" method=\"post\"><label>Dog name<input name=\"dog_name\" type=\"text\"\
