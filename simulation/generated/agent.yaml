inboxes:
- name: world
  kind: http
  uses:
  - name: publishes
    description: The trade press reports something that happened in marketing (a real article)
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/world
      body:
        fact: '{input.fact}'
        source: '{input.source}'
        published: '{input.published}'
        topic: '{input.topic}'
    inputs:
    - name: fact
      description: What happened, as the article says it
    - name: source
      description: The article's link
    - name: published
      description: Its date, YYYY-MM-DD
    - name: topic
      description: 'One of: an event..., a change on a platform..., go-to-market news... (the desk''s Topic value)'
- name: site
  kind: http
  within:
    min: PT5S
    max: PT40S
  leaning: A visitor sees the agent's message pop up over the page while browsing, glances at it for a few seconds, and mostly
    ignores it or deletes it. They open the chat to read it only when it says something about their own problem, write back
    when they have something to say, and leave their email in the form under an offer only for something specific they want.
  pending:
    request:
      kind: template
      url: http://127.0.0.1:{run.port}/api/shown?v={person.key}
    items: $.items[*]
    id: $.id
    summary: $.summary
    decisions: $.decisions
  decisions:
  - name: open
    reads: opened the chat and read it
    description: Opens the chat on the message and reads it, without writing anything
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/thread/read
      body:
        visitor: '{person.key}'
        through: '{item.id}'
  - name: dismiss
    reads: deleted it
    description: "Deletes the message's pop-up with its \xD7"
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/thread/dismiss
      body:
        visitor: '{person.key}'
        id: '{item.id}'
        at: '{clock.now}'
  - name: reply
    reads: wrote back
    description: Opens the chat and writes to the agent
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/thread/send
      body:
        visitor: '{person.key}'
        text: '{input.text}'
        at: '{clock.now}'
    inputs:
    - name: text
      description: What they write
  - name: introduce
    reads: left their name and email
    description: Fills in the form in the chat, under the remark that offered it, with their name, work email and website
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        name: '{input.name}'
        email: '{input.email}'
        website: '{input.website}'
        touch:
          kind: identify
          at: '{clock.now}'
          label: introduced themselves
    inputs:
    - name: name
      description: Their name
    - name: email
      description: Their work email
    - name: website
      description: Their business's website
      required: false
  uses:
  - name: views
    description: Opens a page of the site
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: view
          at: '{clock.now}'
          page: '{input.page}'
          title: '{input.title}'
    inputs:
    - name: page
      description: The page's path
    - name: title
      description: The page's title
      required: false
  - name: reads
    description: Leaves a page, having stayed and scrolled so far
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: read
          at: '{clock.now}'
          page: '{input.page}'
          label: '{input.how}'
    inputs:
    - name: page
      description: The page's path
    - name: how
      description: How long they stayed and how far they scrolled
  - name: clicks
    description: Touches something on a page (an image, a link, the pricing toggle)
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: click
          at: '{clock.now}'
          page: '{input.page}'
          label: '{input.label}'
    inputs:
    - name: page
      description: The page's path
    - name: label
      description: What they touched
  - name: lingers
    description: Stays on one thing on a page (an image, a result) for a few seconds
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: linger
          at: '{clock.now}'
          page: '{input.page}'
          label: '{input.label}'
    inputs:
    - name: page
      description: The page's path
    - name: label
      description: What they stayed on
  - name: picks
    description: Answers one of the page's own questions (a headache chip, "show me work for", the pricing toggle)
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: signal
          at: '{clock.now}'
          page: '{input.page}'
          label: '{input.question}'
          text: '{input.answer}'
    inputs:
    - name: page
      description: The page's path
    - name: question
      description: The page's question
    - name: answer
      description: What they picked
  - name: asks
    description: Asks the agent for something through the page (Roast my site)
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/thread/send
      body:
        visitor: '{person.key}'
        website: '{input.text}'
        asked_through: '{input.label}'
        text: '{input.text}'
        at: '{clock.now}'
    inputs:
    - name: page
      description: The page's path
    - name: label
      description: What the page calls the request
    - name: text
      description: What they typed
  - name: writes
    description: Writes to the agent in the chat
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/thread/send
      body:
        visitor: '{person.key}'
        text: '{input.text}'
        at: '{clock.now}'
    inputs:
    - name: text
      description: What they write
  - name: unsubscribes
    description: Clicks the unsubscribe link at the foot of one of the agent's emails
    request:
      kind: template
      url: http://127.0.0.1:{run.port}/api/unsubscribe?v={person.key}
  - name: leaves
    description: Moves the pointer to the tab bar, about to leave
    request:
      kind: template
      method: POST
      url: http://127.0.0.1:{run.port}/api/events
      body:
        visitor: '{person.key}'
        touch:
          kind: leaving
          at: '{clock.now}'
          page: '{input.page}'
          label: pointer to the tab bar
    inputs:
    - name: page
      description: The page's path
